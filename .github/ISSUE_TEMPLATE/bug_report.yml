name: Bug report
description: Report a reproducible problem in Clay.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please provide a minimal reproduction where possible.
  - type: input
    id: version
    attributes:
      label: Clay revision
      placeholder: commit, tag, or branch
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and toolchain
      placeholder: macOS 15, AppleClang 16, Godot Mono 4.x
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Commands, code, or project needed to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
