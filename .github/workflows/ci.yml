name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lint PR commits
        if: github.event_name == 'pull_request'
        run: ./scripts/lint_commits.sh "origin/${{ github.base_ref }}..HEAD"
      - name: Lint pushed commits
        if: github.event_name == 'push'
        run: ./scripts/lint_commits.sh "${{ github.event.before }}..HEAD"

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCLAY_BUILD_TESTS=ON -DCLAY_BUILD_INTERACTIVE=OFF -DCLAY_BUILD_GDEXTENSION=ON

      - name: Build
        run: cmake --build build --config Debug -j

      - name: Test
        run: ctest --test-dir build -C Debug --timeout 30 --output-on-failure

      - name: Verify installed CMake package
        shell: bash
        run: |
          cmake --install build --config Debug --prefix "$PWD/build/sdk"
          test -f build/sdk/integrations/godot-mono/ClayRuntime.cs
          test -f build/sdk/integrations/godot-mono/ClayKey.cs
          test -f build/sdk/integrations/godot-mono/ClayGodotSample.csproj
          test -f build/sdk/integrations/godot-mono/ClayGodotSample.sln
          test -f build/sdk/integrations/godot-mono/export_presets.cfg
          test -x build/sdk/integrations/godot-mono/godot_mono_stage_native.sh
          test -f build/sdk/integrations/godot-mono/managed/ClayRuntime.csproj
          test -f build/sdk/integrations/godot-gdextension/clay.gdextension
          test -f build/sdk/integrations/godot-gdextension/README.md
          test -f build/sdk/integrations/godot-gdextension/bin/libclay_gdextension.dylib || \
            test -f build/sdk/integrations/godot-gdextension/bin/libclay_gdextension.so || \
            test -f build/sdk/integrations/godot-gdextension/bin/clay_gdextension.dll
          test -f build/sdk/integrations/godot-mono/libclay_engine.dylib || \
            test -f build/sdk/integrations/godot-mono/libclay_engine.so || \
            test -f build/sdk/integrations/godot-mono/clay_engine.dll
          cmake -S test/package-consumer -B build/package-consumer \
            -DCMAKE_PREFIX_PATH="$PWD/build/sdk"
          cmake --build build/package-consumer --config Debug
          ctest --test-dir build/package-consumer -C Debug --timeout 30 --output-on-failure

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify managed calls against installed native library
        run: dotnet run --project test/managed/ClayHostTests.csproj -- build/sdk/integrations/godot-mono

      - name: Verify installed static CMake package
        shell: bash
        run: |
          cmake -S . -B build-static \
            -DCLAY_BUILD_TESTS=OFF -DCLAY_BUILD_INTERACTIVE=OFF \
            -DCLAY_BUILD_EXAMPLES=OFF -DCLAY_BUILD_SHARED=OFF
          cmake --build build-static --config Debug -j
          cmake --install build-static --config Debug --prefix "$PWD/build/static-sdk"
          cmake -S test/package-consumer -B build/static-package-consumer \
            -DCMAKE_PREFIX_PATH="$PWD/build/static-sdk"
          cmake --build build/static-package-consumer --config Debug
          ctest --test-dir build/static-package-consumer -C Debug --timeout 30 --output-on-failure

      - name: Headless demo smoke
        if: runner.os != 'Windows'
        run: |
          mkdir -p build/smoke
          ./build/demo/clay_player --headless --frames 30 --dump build/smoke/garden.png

      - name: Verify explicit offline GLFW disable
        shell: bash
        run: |
          cmake -S . -B build-no-glfw \
            -DCLAY_BUILD_INTERACTIVE=ON -DCLAY_USE_SYSTEM_GLFW=OFF \
            -DCLAY_BUILD_TESTS=OFF -DCLAY_BUILD_EXAMPLES=OFF
          cmake --build build-no-glfw --config Debug --parallel

      - name: Verify audio-device optional build
        shell: bash
        run: |
          cmake -S . -B build-no-audio-device \
            -DCLAY_BUILD_INTERACTIVE=OFF -DCLAY_BUILD_AUDIO_DEVICE=OFF
          cmake --build build-no-audio-device --config Debug --parallel
          ctest --test-dir build-no-audio-device -C Debug \
            --timeout 30 --output-on-failure

  managed-wrapper:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build managed host wrapper
        run: dotnet build integrations/godot-mono/managed/ClayRuntime.csproj --nologo

  godot-mono-project:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Godot Mono sample project
        run: dotnet build integrations/godot-mono/ClayGodotSample.csproj --nologo

  godot-mono-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      GODOT_VERSION: '4.7.2'
      GODOT_LINUX_SHA256: '129f82db7bafd54ae14bb5bb284041c73860e8c7a009a3a026ca5e946cbff247'
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot Mono (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install --cask godot-mono
          echo "GODOT_MONO_BIN=$(command -v godot-mono)" >> "$GITHUB_ENV"

      - name: Install pinned Godot .NET (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          archive="$RUNNER_TEMP/godot-mono-linux.zip"
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          curl --fail --location --retry 3 "$url" --output "$archive"
          actual="$(sha256sum "$archive" | awk '{print $1}')"
          if [[ "$actual" != "$GODOT_LINUX_SHA256" ]]; then
            echo "Godot editor SHA-256 mismatch: $actual" >&2
            exit 1
          fi
          dest="$RUNNER_TEMP/godot-mono-linux"
          unzip -q "$archive" -d "$dest"
          godot="$(find "$dest" -type f -name 'Godot_v*-stable_mono_linux.x86_64' -print -quit)"
          if [[ -z "$godot" ]]; then
            echo "Godot .NET Linux executable not found after extraction" >&2
            exit 1
          fi
          chmod +x "$godot"
          echo "GODOT_MONO_BIN=$godot" >> "$GITHUB_ENV"

      - name: Build Clay shared library
        run: cmake -S . -B build -DCLAY_BUILD_TESTS=OFF -DCLAY_BUILD_INTERACTIVE=OFF -DCLAY_BUILD_GDEXTENSION=ON
      - name: Compile Clay shared library
        run: cmake --build build --config Debug -j
      - name: Run Godot Mono smoke test
        run: ./scripts/godot_mono_smoke.sh

      - name: Stage GDExtension smoke library
        shell: bash
        run: |
          cmake --install build --config Debug --prefix build/sdk
          mkdir -p integrations/godot-gdextension/bin
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            cp build/sdk/integrations/godot-gdextension/bin/libclay_gdextension.dylib \
              integrations/godot-gdextension/bin/
          else
            cp build/sdk/integrations/godot-gdextension/bin/libclay_gdextension.so \
              integrations/godot-gdextension/bin/
          fi

      - name: Run GDExtension headless smoke test
        run: "$GODOT_MONO_BIN" --headless --path integrations/godot-gdextension --quit-after 2
