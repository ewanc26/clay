name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lint PR commits
        if: github.event_name == 'pull_request'
        run: ./scripts/lint_commits.sh "origin/${{ github.base_ref }}..HEAD"
      - name: Lint pushed commits
        if: github.event_name == 'push'
        run: ./scripts/lint_commits.sh "${{ github.event.before }}..HEAD"

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCLAY_BUILD_TESTS=ON -DCLAY_BUILD_INTERACTIVE=OFF

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Verify installed CMake package
        shell: bash
        run: |
          cmake --install build --prefix "$PWD/build/sdk"
          test -f build/sdk/integrations/godot-mono/ClayRuntime.cs
          test -f build/sdk/integrations/godot-mono/ClayKey.cs
          test -f build/sdk/integrations/godot-mono/ClayGodotSample.csproj
          test -f build/sdk/integrations/godot-mono/managed/ClayRuntime.csproj
          test -f build/sdk/integrations/godot-mono/libclay_engine.dylib || \
            test -f build/sdk/integrations/godot-mono/libclay_engine.so || \
            test -f build/sdk/integrations/godot-mono/clay_engine.dll
          cmake -S test/package-consumer -B build/package-consumer \
            -DCMAKE_PREFIX_PATH="$PWD/build/sdk"
          cmake --build build/package-consumer
          ctest --test-dir build/package-consumer --output-on-failure

      - name: Verify installed static CMake package
        shell: bash
        run: |
          cmake -S . -B build-static \
            -DCLAY_BUILD_TESTS=OFF -DCLAY_BUILD_INTERACTIVE=OFF \
            -DCLAY_BUILD_EXAMPLES=OFF -DCLAY_BUILD_SHARED=OFF
          cmake --build build-static -j
          cmake --install build-static --prefix "$PWD/build/static-sdk"
          cmake -S test/package-consumer -B build/static-package-consumer \
            -DCMAKE_PREFIX_PATH="$PWD/build/static-sdk"
          cmake --build build/static-package-consumer
          ctest --test-dir build/static-package-consumer --output-on-failure

      - name: Headless demo smoke
        if: runner.os != 'Windows'
        run: |
          mkdir -p build/smoke
          ./build/demo/clay_player --headless --frames 30 --dump build/smoke/garden.png

  managed-wrapper:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build managed host wrapper
        run: dotnet build integrations/godot-mono/managed/ClayRuntime.csproj --nologo

  godot-mono-project:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Godot Mono sample project
        run: dotnet build integrations/godot-mono/ClayGodotSample.csproj --nologo

  godot-mono-runtime:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot Mono
        run: brew install --cask godot-mono
      - name: Build Clay shared library
        run: cmake -S . -B build -DCLAY_BUILD_TESTS=OFF -DCLAY_BUILD_INTERACTIVE=OFF
      - name: Run Godot Mono smoke test
        env:
          GODOT_MONO_BIN: godot-mono
        run: ./scripts/godot_mono_smoke.sh
