name: godot-linux-export

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/godot-linux-export.yml'
      - 'CMakeLists.txt'
      - 'include/**'
      - 'src/**'
      - 'integrations/godot-mono/**'
      - 'scripts/godot_mono_linux_export_smoke.sh'
  pull_request:
    paths:
      - '.github/workflows/godot-linux-export.yml'
      - 'CMakeLists.txt'
      - 'include/**'
      - 'src/**'
      - 'integrations/godot-mono/**'
      - 'scripts/godot_mono_linux_export_smoke.sh'
  workflow_dispatch:

jobs:
  exported-player:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: '4.7.2'
      GODOT_EDITOR_SHA256: '129f82db7bafd54ae14bb5bb284041c73860e8c7a009a3a026ca5e946cbff247'
      GODOT_TEMPLATES_SHA256: '92f8681e349ef1f90891b792da95e3b2b0bd1ed610b78018c58feb2d87e15a9d'
    steps:
      - uses: actions/checkout@v4

      - name: Configure Clay x86_64
        run: cmake -S . -B build -DCLAY_BUILD_TESTS=OFF -DCLAY_BUILD_INTERACTIVE=OFF

      - name: Build Clay shared library
        run: cmake --build build --config Debug -j

      - name: Download pinned Godot .NET editor
        shell: bash
        run: |
          archive="$RUNNER_TEMP/godot-mono-linux.zip"
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          curl --fail --location --retry 3 "$url" --output "$archive"
          actual="$(sha256sum "$archive" | awk '{print $1}')"
          if [[ "$actual" != "$GODOT_EDITOR_SHA256" ]]; then
            echo "Godot editor SHA-256 mismatch: $actual" >&2
            exit 1
          fi
          dest="$RUNNER_TEMP/godot-mono-linux"
          unzip -q "$archive" -d "$dest"
          godot="$(find "$dest" -type f -name 'Godot_v*-stable_mono_linux.x86_64' -print -quit)"
          if [[ -z "$godot" ]]; then
            echo "Godot .NET Linux executable not found after extraction" >&2
            exit 1
          fi
          chmod +x "$godot"
          echo "GODOT_MONO_BIN=$godot" >> "$GITHUB_ENV"

      - name: Install pinned Godot .NET export templates
        shell: bash
        run: |
          tpz="$RUNNER_TEMP/godot-mono-templates.tpz"
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          curl --fail --location --retry 3 "$url" --output "$tpz"
          actual="$(sha256sum "$tpz" | awk '{print $1}')"
          if [[ "$actual" != "$GODOT_TEMPLATES_SHA256" ]]; then
            echo "Godot templates SHA-256 mismatch: $actual" >&2
            exit 1
          fi
          unpacked="$RUNNER_TEMP/godot-mono-templates"
          mkdir -p "$unpacked"
          unzip -q "$tpz" -d "$unpacked"
          template="$(find "$unpacked" -type f -name 'linux_debug.x86_64' -print -quit)"
          if [[ -z "$template" ]]; then
            echo "Linux x86_64 debug export template not found" >&2
            exit 1
          fi
          target="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono"
          mkdir -p "$target"
          cp -R "$(dirname "$template")"/. "$target"/

      - name: Export and run Linux Godot sample
        shell: bash
        env:
          CLAY_NATIVE_LIBRARY: ${{ github.workspace }}/build/libclay_engine.so
        run: ./scripts/godot_mono_linux_export_smoke.sh
